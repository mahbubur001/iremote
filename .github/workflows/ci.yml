name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run package
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: vsix
          path: '*.vsix'

  integration:
    name: Integration & E2E (Docker servers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:servers:up
      - run: npm run test:integration
      - run: xvfb-run -a npm run test:e2e
      - name: Server logs
        if: failure()
        run: docker compose -f test/docker-compose.yml logs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-vscode-logs
          path: .vscode-test/user-data/logs
      - run: npm run test:servers:down
        if: always()
