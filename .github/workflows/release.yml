name: Release

# Push a tag like v1.0.0 (matching package.json "version") to publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release
      id-token: write # Marketplace Trusted Publishing (vsce --oidc)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm test
      - run: npm run package
      - name: Publish to Visual Studio Marketplace
        run: npx vsce publish --oidc --packagePath iremote-*.vsix
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" iremote-*.vsix --title "iRemote $GITHUB_REF_NAME" --notes "See [CHANGELOG.md](https://github.com/mahbubur001/iremote/blob/main/CHANGELOG.md)."
