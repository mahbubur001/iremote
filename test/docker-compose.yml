# Throw-away servers for integration tests. Credentials are test-only.
name: iremote-test

services:
  sftp:
    image: atmoz/sftp
    platform: linux/amd64
    command: tester:pass:1001:1001:upload
    ports:
      - "2222:22"
    volumes:
      - ./fixtures/id_ed25519.pub:/home/tester/.ssh/keys/id_ed25519.pub:ro
    healthcheck:
      test: ["CMD-SHELL", "pgrep sshd"]
      interval: 2s
      retries: 30

  ftps:
    build: ./proftpd
    ports:
      - "2121:21"
      - "30000-30009:30000-30009"

  vsftpd:
    image: delfer/alpine-ftp-server
    # Run vsftpd in the foreground: the image's default start backgrounds it and guesses the pid with pgrep,
    # which sometimes picks the exiting parent and stops the container ("process has died, quitting").
    # Options after the config file override it.
    command: vsftpd /etc/vsftpd/vsftpd.conf -obackground=NO -opasv_min_port=31000 -opasv_max_port=31009 -opasv_address=127.0.0.1
    environment:
      USERS: "tester|pass|/home/tester"
    ports:
      - "2122:21"
      - "31000-31009:31000-31009"

  webdav:
    image: rclone/rclone
    command: serve webdav /data --addr :8080 --user tester --pass pass
    ports:
      - "8080:8080"
