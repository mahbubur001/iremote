# ProFTPD for integration tests: FEAT/MLSD/MFMT/SITE CHMOD and optional explicit TLS (self-signed).
Include /etc/proftpd/modules.d/
ServerName "iRemote test"
ServerType standalone
DefaultServer on
UseIPv6 off
Port 21
PassivePorts 30000 30009
MasqueradeAddress 127.0.0.1
User nobody
Group nobody
DefaultRoot ~
RequireValidShell off
AllowOverwrite on
Umask 022
MaxInstances 30
<Limit SITE_CHMOD>
  AllowAll
</Limit>
<IfModule mod_tls.c>
  TLSEngine on
  TLSRequired off
  TLSProtocol TLSv1.2 TLSv1.3
  TLSRSACertificateFile /etc/ssl/private/ftp.pem
  TLSRSACertificateKeyFile /etc/ssl/private/ftp.pem
  TLSOptions NoSessionReuseRequired
  TLSVerifyClient off
  TLSLog /dev/stderr
</IfModule>
